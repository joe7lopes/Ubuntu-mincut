<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g transform="rotate(-7 64 64)">
    <!-- sheet of paper with a folded top-right corner -->
    <path d="M40 16 H79 L96 33 V97 a7 7 0 0 1 -7 7 H40 a7 7 0 0 1 -7 -7 V23 a7 7 0 0 1 7 -7 Z"
          fill="#fdfdfb" stroke="#c4cad3" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M79 16 V33 H96 Z" fill="#e8edf3" stroke="#c4cad3" stroke-width="2.5"
          stroke-linejoin="round"/>
    <!-- text on the sheet -->
    <g fill="#d3d9e1">
      <rect x="44" y="46" width="32" height="4" rx="2"/>
      <rect x="44" y="56" width="40" height="4" rx="2"/>
      <rect x="44" y="66" width="26" height="4" rx="2"/>
      <rect x="44" y="76" width="34" height="4" rx="2"/>
    </g>
    <!-- scissors cutting across the sheet -->
    <g transform="translate(82 84) rotate(-35) scale(0.92)" fill="none" stroke-linecap="round">
      <g stroke="#fdfdfb" stroke-width="11">
        <path d="M0 0 L34 -11"/>
        <path d="M0 0 L34 11"/>
        <path d="M0 0 L-14 -9"/>
        <path d="M0 0 L-14 9"/>
        <circle cx="-21" cy="-13" r="7"/>
        <circle cx="-21" cy="13" r="7"/>
      </g>
      <g stroke="#4a515b" stroke-width="6">
        <path d="M0 0 L34 -11"/>
        <path d="M0 0 L34 11"/>
      </g>
      <g stroke="#4a515b" stroke-width="4.5">
        <path d="M0 0 L-14 -9"/>
        <path d="M0 0 L-14 9"/>
      </g>
      <g stroke="#e0574f" stroke-width="5">
        <circle cx="-21" cy="-13" r="7"/>
        <circle cx="-21" cy="13" r="7"/>
      </g>
      <circle cx="0" cy="0" r="4" fill="#4a515b" stroke="none"/>
    </g>
  </g>
</svg>
